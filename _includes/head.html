<head>
<link rel="icon" type="image/png"
      href="{{ '/assets/favicon-96x96.png' | relative_url }}"
      sizes="96x96" />

<link rel="shortcut icon"
      href="{{ '/assets/favicon.ico' | relative_url }}" />

<link rel="apple-touch-icon"
      sizes="180x180"
      href="{{ '/assets/apple-touch-icon.png' | relative_url }}" />

<meta name="apple-mobile-web-app-title" content="curios" />

<link rel="manifest"
      href="{{ '/assets/site.webmanifest' | relative_url }}" />
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{site.title}}</title>
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
